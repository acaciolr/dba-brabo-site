<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VM Manager — ECOSSISTEMA SUPER DBA</title>
<meta name="description" content="Tabela estilo hypervisor das VMs de lab (mock visual Fase 1).">
<meta name="theme-color" content="#0B0D10">
<link rel="icon" href="../../assets/logo/favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../css/tui.css">
<script src="../js/auth.js"></script>
<script>EcoAuth.exigirLogin('../aluno/');</script>
</head>
<body>

<header class="etop">
  <a class="ebrand" href="../" aria-label="ECOSSISTEMA SUPER DBA — início">
    <img src="../../assets/logo/avatar-96.png" alt="" width="28" height="28">
    <span>DBA <b>BRABO</b><small>Super DBA</small></span>
  </a>
  <span class="etop__title">/ VM MANAGER</span>
  <span class="etop__sp"></span>
  <span class="euser" data-eco-user hidden></span>
  <span class="etop__clock" id="clock">--/--/---- --:--:--</span>
  <a class="esair" href="../aluno/" data-eco-sair="../aluno/">Sair</a>
</header>

<div class="ewrap">
  <section class="epanel" style="padding:22px clamp(12px,2vw,22px) 18px">
    <span class="eleg">Hypervisor · mock v1</span>
    <p style="color:var(--eco-dim);font-size:12px;margin:0 0 12px">Tabela visual — Start/Stop/Restart apenas simulam o badge. Console abre o terminal mock da VM.</p>
    <div style="overflow-x:auto">
      <table class="etable" id="vmTable">
        <thead><tr><th>VM</th><th>Tecnologia</th><th>CPU</th><th>RAM</th><th>Status</th><th>Ações</th></tr></thead>
        <tbody><tr><td colspan="6" style="color:var(--eco-faint)">carregando…</td></tr></tbody>
      </table>
    </div>
  </section>

  <footer class="efoot">
    <span class="mock">MOCK v1 — sem backend</span>
    <span style="flex:1"></span>
    <a href="../">Hub</a>
    <a href="../../">Portal</a>
    <a href="../../mentor/">Área do mentor</a>
  </footer>
</div>

<div class="etoast" id="toast" role="status"></div>
<script src="../js/eco.js"></script>
<script src="../js/vmm.js"></script>
</body>
</html>
